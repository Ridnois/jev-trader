# jev-trader v2 · PAPER on real Hyperliquid prices (no exchange keys needed; Jev key in .env.local).
# Run:   jev-trader run          Watch: jev-trader dashboard          Judge: jev-trader report
# Every setting has a default (src/config.rs); this file lists the ones worth knowing.
data_dir = "data-v2"

# Always streamed (order flow + funding). Catalyst trades may also open on any other
# liquid Hyperliquid perp that fresh news names (≥ news.min_volume_musd).
watch = ["BTC", "ETH", "SOL", "HYPE", "XRP", "ZEC", "SUI", "DOGE", "ENA", "kPEPE"]

[exchange]
mode = "paper"
network = "mainnet"

[jev]
batch_size = 10              # headlines per call (~270 tokens of overhead per call, so batch)
max_calls_per_hour = 120     # hard ceiling: headline batches + trade reviews

[news]
# 18 RSS feeds and 4 exchange announcement APIs by default (see src/config.rs DEFAULT_RSS).
announcements = ["binance", "upbit", "bybit", "okx"]
rss_every_secs = 60
announcements_every_secs = 20
max_age_min = 180            # older items on first sight are context, not news
half_life_min = 60           # a headline's pull on the coin's bias halves every hour
min_volume_musd = 10         # catalyst trades on unwatched coins need this 24h volume

[costs]                      # Hyperliquid tier 0, checked 2026-11-06
taker_bps = 4.5
maker_bps = 1.5
slippage_bps = 1.0

[risk]
starting_cash = 10000        # paper dollars
max_positions = 3
max_coin_pct = 0.35          # notional per coin ≤ 35% of capital
max_gross = 1.0              # total notional ≤ 1× capital
daily_loss_pct = 0.02        # trade losses > 2% in a UTC day stop entries until tomorrow
loss_cooldown_min = 30
max_entries_per_hour = 4
max_funding_bps_1h = 0.5     # don't join the side paying crowded funding

[catalyst]                   # news leads: a fresh concrete headline, confirmed by order flow
enabled = true
min_impact = 0.45            # |Jev impact| on −1..1
min_new_info = 0.6           # Jev: a new concrete fact, not opinion or a price recap
max_lag_min = 20             # we saw it within 20 min of publication
confirm_secs = 600           # order flow has 10 min to agree, else the watch expires
confirm_flow = 0.15
max_chase_atr = 1.0          # skip if price already ran > 1 hourly ATR since publication
stop_atr = 1.0
tp_r = 2.0                   # target = 2 × stop, resting as a maker order
trail_r = 1.0
hold_min = 240
risk_pct = 0.005             # 0.5% of capital at risk per trade
entry = "taker"              # speed matters after news
review = true                # one Jev call per entry: priced in? halves or vetoes, never starts

[flow]                       # order flow leads: v1's burst gates, now only WITH the news
enabled = true
min_bias = 0.15              # coin's news bias must point the same way
hold_secs = 1800
cost_mult = 3.0
tp_r = 2.0
risk_pct = 0.0025
entry = "maker"

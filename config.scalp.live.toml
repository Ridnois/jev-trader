# Scalper, LIVE on Hyperliquid mainnet. Real money: try config.testnet.toml first.
# Check: jev-trader --config config.scalp.live.toml hl check
# Run:   jev-trader --config config.scalp.live.toml scalp --live
loop_interval_secs = 60
data_dir = "data-hl-live"   # its own ledger: never shares state with paper

[jev]
model = "jev-latest"
concurrency = 8
timeout_ms = 3000
# max_attempts = 5            # per headline, with exponential backoff, then spiked
# breaker_ticks = 10          # Jev circuit breaker: >50% failed calls over 10 ticks
# breaker_fail_ratio = 0.5    #   (with at least breaker_min_calls) blocks entries
# breaker_min_calls = 4

[market]
interval = "1h"
momentum_window = 20      # close vs 20-candle SMA

[news]
feeds = [
  "https://www.coindesk.com/arc/outboundfeeds/rss/",
  "https://cointelegraph.com/rss",
  "https://decrypt.co/feed",
]
max_age_hours = 6.0       # ignore older items on first sight
half_life_hours = 2.0     # news influence halves every 2h
retain_hours = 48.0
# dedupe_clusters = false     # count a same-story cluster once instead of once per outlet
# cluster_jev_check = true    # ask Jev about borderline duplicates (metadata only)
# [news.event_weight]         # e.g. listing = 0.0 (only after the report backs it)
# [news.source_weight]

[strategy]
news_entry = 0.30         # news score needed to go long (with positive momentum)
news_exit = 0.30          # news score below -0.30 forces exit
# min_clusters = 1        # independent positive stories needed before an entry
# reaction_gate = false   # block entries when positive news keeps failing to lift price
# reaction_min_clusters = 3
# reaction_z = -1.5

[risk]
max_asset_weight = 0.20   # max 20% of equity per asset
max_gross = 0.60          # max 60% invested in total
stop_loss_pct = 0.04      # exit if 4% below average entry
daily_loss_limit_pct = 0.03  # go flat for the day after -3%
cooldown_hours = 6.0      # no re-entry after a stop
min_trade_usd = 10.0
rebalance_band = 0.02     # ignore changes < 2% of equity
# --- Optimization-plan knobs. Every default reproduces the original strategy. ---
# sizing = "fixed"        # "vol": weight = news_score × risk_per_trade / stop distance
# risk_per_trade = 0.005
# stop = "fixed_pct"      # "atr": stop = stop_atr_mult × ATR14 (set from the report's MAE data)
# stop_atr_mult = 2.0
# max_heat = 0.024        # Σ weight × stop distance; default = max_gross × stop_loss_pct
# weekly_loss_limit_pct = 0.05    # halts block entries, never force a sale (off unless set)
# monthly_loss_limit_pct = 0.08
# losing_streak_n = 2             # N losing round trips → no entries for streak_cooldown_hours
# streak_cooldown_hours = 24.0

[paper]
starting_cash = 10000.0
fee_rate = 0.00045        # Hyperliquid taker
slippage_rate = 0.0005    # 5 bps

# [regime]                    # crypto market regime, refreshed hourly (keyless sources)
# enabled = true
# mode = "off"                # "off" = record and display only; "ceiling" | "block" after evidence

# [challenge]                 # one adversarial Jev call before an entry
# enabled = false
# threshold = 0.7
# action = "block"            # or "halve"

# [settle]                    # score headlines / decisions / blocked entries after the fact
# enabled = true
# horizons = [1, 4, 24]
# benchmark = "BTC"

[exchange]
mode = "live"             # real orders; also needs `run --live`
network = "mainnet"
account_env = "HL_ACCOUNT_ADDRESS"      # your main Hyperliquid address (public)
agent_key_env = "HL_AGENT_PRIVATE_KEY"  # API agent wallet key: trades, cannot withdraw
max_capital_usd = 0       # YOU choose this; 0 refuses to start
max_slippage_bps = 30     # IOC limit at most 0.3% through the price
leverage = 1              # cross 1× on each coin, matching the ledger's sizing

[scalp]
# Market microstructure decides; news tilts (news_tilt) and vetoes (hack alert,
# Jev entry review). Every default is listed. Paper fills are charged real
# Hyperliquid fees, and maker entries fill only when trades print through the price.
eval_ms = 500
flow_window_secs = 30
vol_window_secs = 300
baseline_secs = 1800
warmup_secs = 600
min_activity_ratio = 1.5
min_flow_imbalance = 0.25
min_book_imbalance = 0.10
min_push_bps = 3.0
max_chase_bps = 60.0
max_spread_bps = 5.0
hold_secs = 600
# Costs: Hyperliquid perps tier 0 (no volume, no HYPE staked), checked 2026-11-06
# against hyperliquid.gitbook.io/hyperliquid-docs/trading/fees.
fee_bps = 4.5             # taker
maker_fee_bps = 1.5       # post-only (ALO)
slippage_bps = 1.0
cost_mult = 2.0           # typical move over the hold must be ≥ 2× round-trip cost
tp_vol_mult = 1.5
tp_cost_mult = 1.5
sl_vol_mult = 1.0
sl_cost_mult = 1.0
position_pct = 0.10
max_positions = 2
max_trades_per_hour = 6
daily_loss_limit_pct = 0.02
cooldown_after_loss_secs = 900
news_tilt = 0.10
jev_review = true
jev_veto = 0.6
jev_cache_secs = 120
jev_headline_minutes = 180
markouts = [60, 300, 600]
shorts = true             # a short is a plain perp sell
starting_cash = 10000.0   # paper dollars
entry = "maker"           # post at the bid (long) / ask (short); filled only if trades print through it
maker_timeout_secs = 20   # then cancelled and logged as a miss (scalp_orders.jsonl)
trail_after_cost_mult = 1.5  # in profit by 1.5× cost → stop to break-even after fees, then trail

# Universe (2026-11-06, `hl scan`, 72h): liquid perps (24h volume ≥ $18M, impact spread
# ≤ 3.3 bps) whose 10-minute moves clear 2× the maker/taker round trip most often.
# ZEC 75%, kPEPE 72%, ENA 71%, NEAR 70%, HYPE 61%, SOL 55%, XRP 48%, ETH 42%; at Binance
# spot costs the same coins cleared 6–37%. Changing it is hypothesis H-C03.

[[assets]]
symbol = "ZEC"
name = "Zcash"
coin = "ZEC"

[[assets]]
symbol = "HYPE"
name = "Hyperliquid"
coin = "HYPE"

[[assets]]
symbol = "SOL"
name = "Solana"
coin = "SOL"

[[assets]]
symbol = "NEAR"
name = "NEAR Protocol"
coin = "NEAR"

[[assets]]
symbol = "ETH"
name = "Ethereum"
coin = "ETH"

[[assets]]
symbol = "XRP"
name = "XRP"
coin = "XRP"

[[assets]]
symbol = "PEPE"
name = "Pepe (1000×, kPEPE)"
coin = "kPEPE"

[[assets]]
symbol = "ENA"
name = "Ethena"
coin = "ENA"

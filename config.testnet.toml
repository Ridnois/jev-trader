# v2 on Hyperliquid TESTNET with real orders and fake money: checks the order plumbing
# (entries, maker take-profits, backstop stops, reconciliation), not the strategy.
#   jev-trader --env-file .env.hl-testnet --config config.testnet.toml hl check
#   jev-trader --env-file .env.hl-testnet --config config.testnet.toml run --live
data_dir = "data-v2-testnet"
watch = ["BTC", "ETH", "SOL", "HYPE"]   # testnet books are thin; keep to majors

[exchange]
mode = "live"
network = "testnet"
max_capital_usd = 0          # set it yourself; 0 refuses to start
backstop_stop = true

[news]
min_volume_musd = 1e12       # testnet: catalysts only on watched coins

[risk]
max_entries_per_hour = 2

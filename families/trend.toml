# Donchian breakout: buy a close above the high of the previous n bars, sell one
# below their low; leave through the opposite n × out_frac channel.
family = "trend"
interval = "1h"
hypothesis = "H-L02"

[grid]
n = [24, 48, 96, 192, 384]    # 1 to 16 days
out_frac = [0.25, 0.5]
stop = [0, 800]
shorts = [0, 1]

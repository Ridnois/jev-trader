# g0242 — generation 76 — recombine
# g0237 and funding_carry both made money on the design window with a daily correlation of
# +0.05 (L18794). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when ret($n) > 0 and xs_ret($b_look) >= $b_cut and channel($b_b_n) > 1 and xs_ret($b_b_look) >= 0.5 and vol_ratio($b_b_n) >= $b_b_vol_mult and xs_funding($b_b_b_b_look) <= -0.5 and xs_funding($b_look) <= -0.5; short on the mirror; close a long when channel($n) < 0; entries every 24 bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "caa15b5312dc4"
interval = "1h"
hypothesis = "H-G0242"
name = "g0242"
parent = "cde8c3f8871a1"
generation = 76
operator = "recombine"
lessons = ["L18794"]
reason = "g0237 and funding_carry both made money on the design window with a daily correlation of +0.05 (L18794). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [240.0, 480.0, 960.0]

[fixed]
b_b_b_b_look = 336.0
b_b_look = 336.0
b_b_n = 384.0
b_b_vol_mult = 2.5
b_cut = 0.6
b_look = 72.0
hold_days = 30.0
shorts = 0.0
stop = 0.0

[rule]
short = "mirror"
filter = []
exit_opposite = false
every = 24.0
extend = true

[[rule.long]]
feature = "ret"
n = "$n"
op = ">"
level = 0.0

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "channel"
n = "$b_b_n"
op = ">"
level = 1.0

[[rule.long]]
feature = "xs_ret"
n = "$b_b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "vol_ratio"
n = "$b_b_n"
op = ">="
level = "$b_b_vol_mult"

[[rule.long]]
feature = "xs_funding"
n = "$b_b_b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

[[rule.exit]]
feature = "channel"
n = "$n"
op = "<"
level = 0.0

# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_funding($b_look) <= -0.5 and xs_ret($b_b_look) >= 0.5 and xs_ret($b_look) >= $b_cut; short on the mirror
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "cc19280c3f5d0"
interval = "1h"
hypothesis = "H-G0163"
name = "g0163"
parent = "c27e009de60e2"
generation = 50
operator = "recombine"
lessons = ["L6167"]
reason = "g0089 and g0021 both made money on the design window with a daily correlation of +0.04 (L6167). Entering only when both agree tests whether each confirms the other."

[grid]

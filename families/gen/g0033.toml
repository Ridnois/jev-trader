# g0033 — generation 9 — recombine
# g0030 and g0024 both made money on the design window with a daily correlation of -0.01
# (L494). Entering only when both agree tests whether each confirms the other.
# Rule: long when xs_ret($look) >= $cut and xs_funding($b_look) <= -0.5 and xs_ret($b_look) >= $b_cut and channel($b_n) > 1 and vol_ratio($b_n) >= $b_vol_mult; long only; entries every $hold bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c45c21cfa49b0"
interval = "1h"
hypothesis = "H-G0033"
name = "g0033"
parent = "c35f4eddf644f"
generation = 9
operator = "recombine"
lessons = ["L494"]
reason = "g0030 and g0024 both made money on the design window with a daily correlation of -0.01 (L494). Entering only when both agree tests whether each confirms the other."

[grid]
look = [672.0, 1344.0, 2688.0]

[fixed]
b_cut = 0.6
b_look = 168.0
b_n = 48.0
b_vol_mult = 2.5
cut = 0.6
hold = 24.0

[rule]
short = "none"
filter = []
exit = []
exit_opposite = false
every = "$hold"
extend = true

[[rule.long]]
feature = "xs_ret"
n = "$look"
op = ">="
level = "$cut"

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "channel"
n = "$b_n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$b_n"
op = ">="
level = "$b_vol_mult"

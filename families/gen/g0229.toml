# g0229 — generation 72 — recombine
# cdbe503349ad8 and funding_carry both made money on the design window with a daily
# correlation of -0.01 (L3321). Entering only when both agree tests whether each confirms
# the other. The parent is hand-written and its block form is an approximation, so this
# child is not a strict variant of it.
# Rule: long when ret($n) > 0 and xs_funding($b_look) <= -0.5; long only; only when funding($flook) < $fcap; close a long when channel($n) < 0 or funding($flook) >= $fcap; entries every 24 bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c4617a012f259"
interval = "1h"
hypothesis = "H-G0229"
name = "g0229"
parent = "cdbe503349ad8"
generation = 72
operator = "recombine"
lessons = ["L3321"]
reason = "cdbe503349ad8 and funding_carry both made money on the design window with a daily correlation of -0.01 (L3321). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [240.0, 480.0, 960.0]

[fixed]
b_look = 72.0
fcap = 0.0084
flook = 168.0
hold_days = 30.0
stop = 0.0

[rule]
short = "none"
exit_opposite = false
every = 24.0
extend = true

[[rule.long]]
feature = "ret"
n = "$n"
op = ">"
level = 0.0

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

[[rule.filter]]
feature = "funding"
n = "$flook"
op = "<"
level = "$fcap"

[[rule.exit]]
feature = "channel"
n = "$n"
op = "<"
level = 0.0

[[rule.exit]]
feature = "funding"
n = "$flook"
op = ">="
level = "$fcap"

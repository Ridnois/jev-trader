n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "xs_funding"
n = "$b_b_b_look"
op = "<="
level = -0.5

[[rule.long]]

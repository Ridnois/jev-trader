# g0165 — generation 50 — recombine
# g0100 and funding_carry both made money on the design window with a daily correlation of
# +0.09 (L6774). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= 0.5 and xs_funding($b_b_look) <= -0.5 and xs_ret($b_look) >= $b_cut and xs_funding($b_b_b_look) <= -0.5 and channel($b_b_n) > 1 and xs_funding($b_look) <= -0.5; long only
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "cbbca9d569af8"
interval = "1h"
hypothesis = "H-G0165"
name = "g0165"
parent = "cfa15c13ac2e9"
generation = 50
operator = "recombine"
lessons = ["L6774"]
reason = "g0100 and funding_carry both made money on the design window with a daily correlation of +0.09 (L6774). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [6.0, 12.0, 24.0]

[fixed]
b_b_b_look = 168.0
b_b_look = 1344.0
b_b_n = 384.0
b_cut = 0.6
b_look = 72.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]

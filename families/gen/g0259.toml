# g0259 — generation 82 — recombine
# g0257 and funding_carry both made money on the design window with a daily correlation of
# +0.10 (L21429). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= $b_cut and xs_ret($b_b_look) >= 0.5 and xs_funding($b_b_b_look) <= -0.5 and channel($b_b_b_n) > 1 and xs_funding($b_look) <= -0.5; long only; only when mkt_rvol_pct(24) < 0.9

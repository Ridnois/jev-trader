# Rule: long when xs_ret($look) >= $cut and xs_funding($b_look) <= -0.5 and xs_ret($b_look) >= $b_cut and channel($b_n) > 1 and vol_ratio($b_n) >= $b_vol_mult and xs_ret($b_b_look) >= $b_b_cut; long only; entries every $hold bars

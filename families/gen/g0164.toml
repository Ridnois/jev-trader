# g0164 — generation 50 — recombine
# g0064 and funding_carry both made money on the design window with a daily correlation of
# +0.08 (L5006). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= 0.5 and xs_funding($b_b_look) <= -0.5 and xs_funding($b_look) <= -0.5; short on the mirror
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c25335f84f013"
interval = "1h"
hypothesis = "H-G0164"
name = "g0164"
parent = "cf866d7d8af32"
generation = 50
operator = "recombine"
lessons = ["L5006"]
reason = "g0064 and funding_carry both made money on the design window with a daily correlation of +0.08 (L5006). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [12.0, 24.0, 48.0]

[fixed]
b_b_look = 168.0
b_look = 72.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "mirror"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

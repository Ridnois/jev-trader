# g0047 — generation 12 — recombine
# g0025 and g0036 both made money on the design window with a daily correlation of +0.01
# (L532). Entering only when both agree tests whether each confirms the other.
# Rule: long when xs_ret($look) >= $cut and xs_funding($b_look) <= -0.5 and channel($b_n) > 1 and vol_ratio($b_n) >= $b_vol_mult and xs_ret($b_b_look) >= $b_b_cut; long only; entries every $hold bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c6f5246385ee8"
interval = "1h"
hypothesis = "H-G0047"
name = "g0047"
parent = "c4a39d2abc465"
generation = 12
operator = "recombine"
lessons = ["L532"]
reason = "g0025 and g0036 both made money on the design window with a daily correlation of +0.01 (L532). Entering only when both agree tests whether each confirms the other."

[grid]
look = [336.0, 672.0, 1344.0]

[fixed]
b_b_cut = 0.6
b_b_look = 336.0
b_look = 168.0
b_n = 24.0

# g0170 — generation 52 — recombine
# g0098 and trend both made money on the design window with a daily correlation of +0.00
# (L7005). Entering only when both agree tests whether each confirms the other.
# Rule: long when xs_ret($look) >= $cut and channel($b_n) > 1 and xs_ret($b_look) >= 0.5 and vol_ratio($b_n) >= $b_vol_mult and xs_funding($b_b_b_look) <= -0.5; short on the mirror; entries every $hold bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "cabe7cebd693f"
interval = "1h"
hypothesis = "H-G0170"
name = "g0170"
parent = "ca44482e48f89"
generation = 52
operator = "recombine"
lessons = ["L7005"]
reason = "g0098 and trend both made money on the design window with a daily correlation of +0.00 (L7005). Entering only when both agree tests whether each confirms the other."

[grid]
look = [168.0, 336.0, 672.0]

[fixed]
b_b_b_look = 336.0
b_look = 336.0
b_n = 384.0
b_vol_mult = 2.5
cut = 0.6
hold = 24.0

[rule]
short = "mirror"
filter = []
exit = []
exit_opposite = false
every = "$hold"
extend = true

[[rule.long]]
feature = "xs_ret"
n = "$look"
op = ">="
level = "$cut"

[[rule.long]]
feature = "channel"
n = "$b_n"
op = ">"
level = 1.0

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "vol_ratio"
n = "$b_n"
op = ">="
level = "$b_vol_mult"

[[rule.long]]
feature = "xs_funding"
n = "$b_b_b_look"
op = "<="
level = -0.5

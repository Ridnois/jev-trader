family = "cbfc527c1f7a4"
interval = "1h"
hypothesis = "H-G0048"
name = "g0048"
parent = "c920de65510cc"
generation = 12
operator = "recombine"
lessons = ["L616"]
reason = "g0036 and g0006 both made money on the design window with a daily correlation of +0.01 (L616). Entering only when both agree tests whether each confirms the other."

[grid]

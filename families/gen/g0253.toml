# g0253 — generation 80 — recombine
# g0252 and g0170 both made money on the design window with a daily correlation of +0.07
# (L20654). Entering only when both agree tests whether each confirms the other.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= 0.5 and xs_ret($b_look) >= $b_cut and channel($b_b_n) > 1 and xs_funding($b_b_b_look) <= -0.5 and vol_ratio($b_b_n) >= $b_b_vol_mult; long only
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c74a094e9f39c"
interval = "1h"
hypothesis = "H-G0253"
name = "g0253"
parent = "c952cf49f6397"
generation = 80
operator = "recombine"
lessons = ["L20654"]
reason = "g0252 and g0170 both made money on the design window with a daily correlation of +0.07 (L20654). Entering only when both agree tests whether each confirms the other."

[grid]
n = [24.0, 48.0, 96.0]

[fixed]
b_b_b_look = 336.0
b_b_n = 384.0
b_b_vol_mult = 2.5
b_cut = 0.6
b_look = 336.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "none"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "channel"
n = "$b_b_n"
op = ">"
level = 1.0

[[rule.long]]
feature = "xs_funding"
n = "$b_b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "vol_ratio"
n = "$b_b_n"
op = ">="
level = "$b_b_vol_mult"

# g0117 — generation 34 — recombine
# g0048 and g0016 both made money on the design window with a daily correlation of +0.03
# (L3165). Entering only when both agree tests whether each confirms the other.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= $b_cut and xs_ret($b_look) >= 0.5 and xs_funding($b_b_look) <= -0.5 and ret($b_n) > $b_min_ret; short on the mirror; only when mkt_ret($b_mkt_n) > 0
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c1bd6772eae53"
interval = "1h"
hypothesis = "H-G0117"
name = "g0117"
parent = "cbfc527c1f7a4"
generation = 34
operator = "recombine"
lessons = ["L3165"]
reason = "g0048 and g0016 both made money on the design window with a daily correlation of +0.03 (L3165). Entering only when both agree tests whether each confirms the other."

[grid]
n = [6.0, 12.0, 24.0]

[fixed]
b_b_look = 168.0
b_cut = 0.6
b_look = 672.0
b_min_ret = 0.1
b_mkt_n = 720.0
b_n = 168.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "mirror"
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "ret"
n = "$b_n"
op = ">"
level = "$b_min_ret"

[[rule.filter]]
feature = "mkt_ret"
n = "$b_mkt_n"
op = ">"
level = 0.0

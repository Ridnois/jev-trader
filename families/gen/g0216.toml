# g0216 — generation 67 — recombine
# g0053 and xs_reversal both made money on the design window with a daily correlation of
# -0.01 (L6377). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when xs_ret($look) >= $cut and channel($b_n) > 1 and xs_ret($b_look) >= 0.5 and xs_funding($b_b_look) <= -0.5 and vol_ratio($b_n) >= $b_vol_mult; short on the mirror; entries every $hold bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c0c5856364f50"
interval = "1h"
hypothesis = "H-G0216"
name = "g0216"
parent = "cdf4f1bfee696"
generation = 67
operator = "recombine"
lessons = ["L6377"]
reason = "g0053 and xs_reversal both made money on the design window with a daily correlation of -0.01 (L6377). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
look = [168.0, 336.0, 672.0]

[fixed]
b_b_look = 336.0
b_look = 168.0
b_n = 24.0
b_vol_mult = 2.5
cut = 0.6
hold = 24.0

[rule]
short = "mirror"
filter = []
exit = []
exit_opposite = false
every = "$hold"
extend = true

[[rule.long]]
feature = "xs_ret"
n = "$look"
op = ">="
level = "$cut"

[[rule.long]]
feature = "channel"
n = "$b_n"
op = ">"
level = 1.0

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "vol_ratio"
n = "$b_n"
op = ">="
level = "$b_vol_mult"

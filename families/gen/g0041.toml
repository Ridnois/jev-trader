# g0041 — generation 11 — recombine
# g0039 and xs_reversal both made money on the design window with a daily correlation of
# +0.01 (L645). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when xs_ret($look) >= $cut and xs_funding($b_look) <= -0.5 and channel($b_n) > 1 and vol_ratio($b_n) >= $b_vol_mult and xs_ret($b_b_look) >= 0.5 and xs_ret($b_look) >= 0.5; long only; entries every $hold bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c3cb6bad04995"
interval = "1h"
hypothesis = "H-G0041"
name = "g0041"
parent = "cd62b359e54c9"
generation = 11
operator = "recombine"

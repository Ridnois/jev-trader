# g0236 — generation 74 — recombine
# g0233 and funding_carry both made money on the design window with a daily correlation of
# +0.02 (L17944). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when ret($n) > 0 and xs_funding($b_look) <= -0.5 and xs_ret($b_look) >= $b_cut and channel($b_b_b_n) > 1; long only; only when funding($flook) < $fcap; close a long when channel($n) < 0 or funding($flook) >= $fcap; entries every 24 bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c0c08bcc01637"
interval = "1h"
hypothesis = "H-G0236"
name = "g0236"
parent = "c505e69e15b1d"
generation = 74
operator = "recombine"
lessons = ["L17944"]
reason = "g0233 and funding_carry both made money on the design window with a daily correlation of +0.02 (L17944). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [120.0, 240.0, 480.0]

[fixed]
b_b_b_n = 384.0
b_cut = 0.6
b_look = 72.0
fcap = 0.0084
flook = 168.0
hold_days = 30.0
stop = 0.0

[rule]
short = "none"
exit_opposite = false
every = 24.0
extend = true

[[rule.long]]
feature = "ret"
n = "$n"
op = ">"
level = 0.0

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "channel"
n = "$b_b_b_n"
op = ">"
level = 1.0

[[rule.filter]]
feature = "funding"
n = "$flook"
op = "<"
level = "$fcap"

[[rule.exit]]
feature = "channel"
n = "$n"
op = "<"
level = 0.0

[[rule.exit]]
feature = "funding"
n = "$flook"
op = ">="
level = "$fcap"

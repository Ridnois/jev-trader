# g0237 — generation 74 — recombine
# g0231 and g0090 both made money on the design window with a daily correlation of +0.04
# (L17694). Entering only when both agree tests whether each confirms the other.
# Rule: long when ret($n) > 0 and xs_ret($b_look) >= $b_cut and channel($b_b_n) > 1 and xs_ret($b_b_look) >= 0.5 and vol_ratio($b_b_n) >= $b_b_vol_mult and xs_funding($b_b_b_b_look) <= -0.5; short on the mirror; close a long when channel($n) < 0; entries every 24 bars

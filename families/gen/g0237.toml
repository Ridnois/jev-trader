name = "g0237"
parent = "c2b826a2abbf4"
generation = 74
operator = "recombine"
lessons = ["L17694"]
reason = "g0231 and g0090 both made money on the design window with a daily correlation of +0.04 (L17694). Entering only when both agree tests whether each confirms the other."

[grid]
n = [240.0, 480.0, 960.0]

[fixed]

# g0196 — generation 60 — recombine
# g0123 and g0134 both made money on the design window with a daily correlation of +0.02
# (L8807). Entering only when both agree tests whether each confirms the other.
# Rule: long when xs_ret($look) >= $cut and channel($b_n) > 1 and xs_funding($b_look) <= -0.5 and vol_ratio($b_n) >= $b_vol_mult and xs_ret($b_b_look) >= $b_b_cut and channel($b_b_b_b_n) > 1; long only; entries every $hold bars
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "ca9ede16ba501"
interval = "1h"
hypothesis = "H-G0196"
name = "g0196"
parent = "cd0ece8ed3ce6"
generation = 60
operator = "recombine"
lessons = ["L8807"]
reason = "g0123 and g0134 both made money on the design window with a daily correlation of +0.02 (L8807). Entering only when both agree tests whether each confirms the other."

[grid]

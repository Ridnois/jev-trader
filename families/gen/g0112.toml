# g0112 — generation 32 — recombine
# g0035 and funding_carry both made money on the design window with a daily correlation of
# +0.01 (L2577). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= 0.5 and xs_funding($b_look) <= -0.5; short on the mirror
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c6cc2b79f4859"
interval = "1h"
hypothesis = "H-G0112"
name = "g0112"
parent = "ccccf68fc83c0"
generation = 32
operator = "recombine"
lessons = ["L2577"]
reason = "g0035 and funding_carry both made money on the design window with a daily correlation of +0.01 (L2577). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [24.0, 48.0, 96.0]

[fixed]
b_look = 72.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "mirror"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

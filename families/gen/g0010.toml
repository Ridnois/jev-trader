# g0010 — generation 3 — recombine
# g0007 and funding_carry both made money on the design window with a daily correlation of
# -0.07 (L83). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when channel($n) > 1 and xs_funding($b_look) <= -0.5; short on the mirror; close a long when channel($n*$out_frac) < -1
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "cdeda7bae109d"
interval = "1h"
hypothesis = "H-G0010"
name = "g0010"
parent = "c4628412b4bd4"
generation = 3
operator = "recombine"
lessons = ["L83"]
reason = "g0007 and funding_carry both made money on the design window with a daily correlation of -0.07 (L83). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [192.0, 384.0, 768.0]

[fixed]
b_look = 168.0
out_frac = 0.25
shorts = 0.0
stop = 800.0

[rule]
short = "mirror"
filter = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

[[rule.exit]]
feature = "channel"
n = "$n*$out_frac"
op = "<"
level = -1.0

# g0044 — generation 11 — recombine
# g0037 and g0020 both made money on the design window with a daily correlation of +0.17
# (L618). Entering only when both agree tests whether each confirms the other.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= 0.5 and xs_ret($b_look) >= $b_cut; long only
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c2a64b25eabab"
interval = "1h"
hypothesis = "H-G0044"
name = "g0044"
parent = "ce8cab815e591"
generation = 11
operator = "recombine"
lessons = ["L618"]
reason = "g0037 and g0020 both made money on the design window with a daily correlation of +0.17 (L618). Entering only when both agree tests whether each confirms the other."

[grid]
n = [24.0, 48.0, 96.0]

[fixed]
b_cut = 0.6
b_look = 168.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "none"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

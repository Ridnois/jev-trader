# g0063 — generation 16 — recombine
# g0024 and g0001 both made money on the design window with a daily correlation of -0.02
# (L609). Entering only when both agree tests whether each confirms the other.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_funding($b_look) <= -0.5; short on the mirror
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c5b8ccd974b37"
interval = "1h"
hypothesis = "H-G0063"
name = "g0063"
parent = "c381325fadbc6"
generation = 16
operator = "recombine"
lessons = ["L609"]
reason = "g0024 and g0001 both made money on the design window with a daily correlation of -0.02 (L609). Entering only when both agree tests whether each confirms the other."

[grid]
n = [24.0, 48.0, 96.0]

[fixed]
b_look = 336.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "mirror"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"

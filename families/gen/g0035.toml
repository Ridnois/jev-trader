# g0035 — generation 9 — recombine
# g0024 and g0002 both made money on the design window with a daily correlation of +0.00
# (L417). Entering only when both agree tests whether each confirms the other.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= 0.5; short on the mirror
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "ccccf68fc83c0"
interval = "1h"
hypothesis = "H-G0035"
name = "g0035"
parent = "c381325fadbc6"
generation = 9
operator = "recombine"
lessons = ["L417"]
reason = "g0024 and g0002 both made money on the design window with a daily correlation of +0.00 (L417). Entering only when both agree tests whether each confirms the other."

[grid]
n = [24.0, 48.0, 96.0]

[fixed]
b_look = 336.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "mirror"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"

# g0060 — generation 15 — recombine
# g0049 and g0020 both made money on the design window with a daily correlation of -0.01
# (L887). Entering only when both agree tests whether each confirms the other.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= $b_cut and xs_ret($b_look) >= 0.5 and xs_funding($b_b_look) <= -0.5 and xs_ret($b_look) >= $b_cut; long only
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c57be1aac39a7"
interval = "1h"
hypothesis = "H-G0060"
name = "g0060"
parent = "c8309b88afbe5"
generation = 15
operator = "recombine"
lessons = ["L887"]
reason = "g0049 and g0020 both made money on the design window with a daily correlation of -0.01 (L887). Entering only when both agree tests whether each confirms the other."

[grid]
n = [6.0, 12.0, 24.0]

[fixed]
b_b_look = 168.0
b_cut = 0.6
b_look = 168.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "none"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_funding"
n = "$b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

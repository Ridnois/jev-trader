# g0254 — generation 80 — recombine
# g0251 and funding_carry both made money on the design window with a daily correlation of
# +0.17 (L20591). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= 0.5 and xs_ret($b_look) >= $b_cut and xs_funding($b_b_look) <= -0.5 and ret($b_b_n) > $b_b_min_ret and xs_funding($b_look) <= -0.5; long only; only when mkt_ret($b_b_mkt_n) > 0
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c37c4d0a32684"
interval = "1h"
hypothesis = "H-G0254"
name = "g0254"
parent = "caddaf9cc893f"
generation = 80
operator = "recombine"
lessons = ["L20591"]
reason = "g0251 and funding_carry both made money on the design window with a daily correlation of +0.17 (L20591). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [12.0, 24.0, 48.0]

[fixed]
b_b_look = 168.0
b_b_min_ret = 0.1
b_b_mkt_n = 720.0
b_b_n = 336.0
b_cut = 0.6
b_look = 72.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "none"
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = 0.5

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

[[rule.long]]
feature = "xs_funding"
n = "$b_b_look"
op = "<="
level = -0.5

[[rule.long]]
feature = "ret"
n = "$b_b_n"
op = ">"
level = "$b_b_min_ret"

[[rule.long]]
feature = "xs_funding"
n = "$b_look"
op = "<="
level = -0.5

[[rule.filter]]
feature = "mkt_ret"
n = "$b_b_mkt_n"
op = ">"
level = 0.0

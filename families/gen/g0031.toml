# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c1ab75bcb05bd"
interval = "1h"
hypothesis = "H-G0031"
name = "g0031"
parent = "c6c120d2d02c0"
generation = 8
operator = "recombine"
lessons = ["L433"]
reason = "g0026 and g0001 both made money on the design window with a daily correlation of +0.07 (L433). Entering only when both agree tests whether each confirms the other."

[grid]
look = [336.0, 672.0, 1344.0]

[fixed]

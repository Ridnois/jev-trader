# g0013 — generation 4 — recombine
# g0010 and funding_carry both made money on the design window with a daily correlation of
# +0.13 (L129). Entering only when both agree tests whether each confirms the other. The
# parent is hand-written and its block form is an approximation, so this child is not a
# strict variant of it.
# Rule: long when channel($n) > 1 and xs_funding($b_look) <= -0.5 and xs_funding($b_look) <= -0.5; short on the mirror; close a long when channel($n*$out_frac) < -1
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c3c405e34622c"
interval = "1h"
hypothesis = "H-G0013"
name = "g0013"
parent = "cdeda7bae109d"
generation = 4
operator = "recombine"
lessons = ["L129"]
reason = "g0010 and funding_carry both made money on the design window with a daily correlation of +0.13 (L129). Entering only when both agree tests whether each confirms the other. The parent is hand-written and its block form is an approximation, so this child is not a strict variant of it."

[grid]
n = [96.0, 192.0, 384.0]

[fixed]
b_look = 168.0
out_frac = 0.25
shorts = 0.0
stop = 800.0

[rule]
short = "mirror"
filter = []
exit_opposite = false
extend = false

[[rule.long]]

# g0036 — generation 9 — recombine
# g0024 and g0021 both made money on the design window with a daily correlation of +0.01
# (L425). Entering only when both agree tests whether each confirms the other.
# Rule: long when channel($n) > 1 and vol_ratio($n) >= $vol_mult and xs_ret($b_look) >= $b_cut; short on the mirror
# Written by `lab propose`. The family name is the rule's id: editing the rule makes a new family.

family = "c920de65510cc"
interval = "1h"
hypothesis = "H-G0036"
name = "g0036"
parent = "c381325fadbc6"
generation = 9
operator = "recombine"
lessons = ["L425"]
reason = "g0024 and g0021 both made money on the design window with a daily correlation of +0.01 (L425). Entering only when both agree tests whether each confirms the other."

[grid]
n = [24.0, 48.0, 96.0]

[fixed]
b_cut = 0.6
b_look = 336.0
hold_days = 3.0
stop = 600.0
vol_mult = 2.5

[rule]
short = "mirror"
filter = []
exit = []
exit_opposite = false
extend = false

[[rule.long]]
feature = "channel"
n = "$n"
op = ">"
level = 1.0

[[rule.long]]
feature = "vol_ratio"
n = "$n"
op = ">="
level = "$vol_mult"

[[rule.long]]
feature = "xs_ret"
n = "$b_look"
op = ">="
level = "$b_cut"

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Wire Desk</title>
<link rel="preload" href="/fonts/archivo-narrow-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/courier-prime-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/classic/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-wire" viewBox="0 0 20 20"><path d="M5 3h10v4H5zM3 9h14v4H3zM5 15h10v2H5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-run" viewBox="0 0 20 20"><path d="M8 5h9M8 10h9M8 15h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="4" cy="5" r="1.4" fill="currentColor"/><circle cx="4" cy="10" r="1.4" fill="currentColor"/><circle cx="4" cy="15" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-pipe" viewBox="0 0 20 20"><circle cx="4" cy="10" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="4.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="15.5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6.1 9l7.8-3.6M6.1 11l7.8 3.6" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-trades" viewBox="0 0 20 20"><path d="M3 7h13l-3-3M17 13H4l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-score" viewBox="0 0 20 20"><path d="M3 17h14M5 17V11M10 17V5M15 17V8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-scalp" viewBox="0 0 20 20"><path d="M2.5 11h3l2-6 3.5 11 2.5-7 1.5 2h2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 20 20"><path d="M7 4.5v11M13 4.5v11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6.5 4.5l9 5.5-9 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-flat" viewBox="0 0 20 20"><path d="M10 3v9M6 8.5l4 4 4-4M4 16.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-out" viewBox="0 0 20 20"><path d="M8 4H4v12h12v-4M11 3h6v6M17 3l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="desk">
  <nav class="rail" aria-label="Primary">
    <a class="mark" href="#wire">JEV/WIRE</a>
    <div class="deskgroup" data-desk="news">
      <p class="deskname" id="desk-news"><span class="dot"></span><b>News desk</b><span class="tag">paper</span></p>
      <ul>
        <li><a href="#wire" data-view="wire"><svg><use href="#i-wire"/></svg>Wire</a></li>
        <li><a href="#run" data-view="run"><svg><use href="#i-run"/></svg>Run list</a></li>
        <li><a href="#pipeline" data-view="pipeline"><svg><use href="#i-pipe"/></svg>Pipeline</a></li>
        <li><a href="#trades" data-view="trades"><svg><use href="#i-trades"/></svg>Trades</a></li>
        <li><a href="#score" data-view="score"><svg><use href="#i-score"/></svg>Scorecard</a></li>
      </ul>
    </div>
    <div class="deskgroup" data-desk="scalp">
      <p class="deskname" id="desk-scalp"><span class="dot"></span><b>Scalp desk</b><span class="tag">testnet</span></p>
      <ul>
        <li><a href="#scalp" data-view="scalp"><svg><use href="#i-scalp"/></svg>Scalper</a></li>
      </ul>
    </div>
    <div class="beat" id="beat" role="status" aria-live="polite">
      <div class="beatrow" id="beat-news"><span class="dot"></span><strong>News desk</strong><span class="line">Connecting…</span><span class="venue">Paper · simulated</span></div>
      <div class="beatrow" id="beat-scalp"><span class="dot"></span><strong>Scalp desk</strong><span class="line">Connecting…</span><span class="venue"></span></div>
      <span class="synth" id="beat-synth" hidden>Synthetic data</span>
    </div>
  </nav>

  <main class="work" id="work">
    <header class="bar">
      <div class="title">
        <h1 id="view-title">The wire</h1>
        <p id="view-sub"></p>
      </div>
      <div class="controls">
        <button type="button" class="btn" id="btn-pause"><svg><use href="#i-pause"/></svg><span>Pause trading</span></button>
        <button type="button" class="btn btn-ink" id="btn-flatten"><svg><use href="#i-flat"/></svg><span>Flatten all</span></button>
        <button type="button" class="btn btn-quiet" id="btn-flatten-cancel" hidden>Cancel</button>
      </div>
    </header>
    <div id="posture" role="status" aria-live="polite"></div>
    <div id="notices"></div>
    <section id="view" aria-live="off"></section>
  </main>

  <aside class="glance" aria-label="At a glance">
    <section class="eq" id="eq"></section>
    <section id="runlist"></section>
    <section id="health"></section>
  </aside>
</div>
<script src="/classic/app.js"></script>
</body>
</html>

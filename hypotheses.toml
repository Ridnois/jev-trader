# v2 hypothesis register. Write a change here BEFORE testing it; decide it from
# `jev-trader report` (net of costs, 95% ranges clustered by UTC hour, ≥ 20 hours).
# v1's register (H-001…, H-C01…, H-P01…) is in git tag v1.
# status: proposed | testing | accepted | rejected

[[hypothesis]]
id = "V2-01"
statement = "Strong, fresh, concrete headlines (Jev |impact| ≥ 0.45, new fact ≥ 0.6, seen ≤ 20 min) move price in Jev's direction by more than the round-trip cost within 60 min"
metric = "report: strong headlines, 60 min, mean net bps"
pass_if = "95% range above 0 with ≥ 20 independent hours"
invalidate_if = "95% range below 0, or mean ≤ 0 after 40 hours"
status = "testing"
result = ""

[[hypothesis]]
id = "V2-02"
statement = "Catalyst trades (headline + flow confirmation + not chased) pay after fees"
metric = "report: trades, catalyst, mean bps"
pass_if = "verdict 'pays'"
invalidate_if = "verdict 'loses', or V2-01 rejected"
status = "testing"
result = ""

[[hypothesis]]
id = "V2-03"
statement = "Flow candidates that agree with the news bias beat those without news support"
metric = "report: flow, longest horizon, agree vs no support"
pass_if = "agree minus no-support > 0 with non-overlapping ranges, and agree > 0"
invalidate_if = "no difference after 40 hours: then disable [flow]"
status = "testing"
result = ""

[[hypothesis]]
id = "V2-04"
statement = "Exchange listing announcements (Binance/Upbit/Bybit/OKX) carry more edge than outlet news"
metric = "report: strong headlines by kind, 60 min"
pass_if = "listing mean net bps above news with ≥ 20 hours each"
invalidate_if = "listing ≤ news"
status = "testing"
result = ""

[[hypothesis]]
id = "V2-05"
statement = "Jev's priced-in review improves catalyst trades (halved / vetoed trades would have done worse)"
metric = "candidates.jsonl review fields joined to event markouts"
pass_if = "vetoed headlines' 60-min markout below entered ones"
invalidate_if = "no difference after 30 reviews: set catalyst.review = false and save the calls"
status = "proposed"
result = ""

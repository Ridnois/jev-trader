# --- v3 lab (DESIGN-V3.md, registered 2026-11-11 before any lab run). ---
# These are judged by `jev-trader lab validate`, whose thresholds live in lab.toml.
# "pass" means verdict PROMOTE_TO_PAPER; nothing else counts.

[[hypothesis]]
id = "H-L01"
statement = "Some rule in H-R01's neighbourhood (fade a 15m close stretched 1.5-3 std from its 1-6 day mean, held 3-24h) pays after Hyperliquid costs and funding once the search over 384 rules is accounted for"
change = "families/meanrev.toml on ~2.8 years of Binance USDT-M 15m candles (research proxy), 20 coins with a point-in-time volume filter, then Hyperliquid candles and funding"
metric = "lab gate: walk-forward out-of-sample daily mean, family-wide reality check, deflated Sharpe, PBO, lockbox"
baseline = "zero after costs; time-shifted copies of the same signals; H-R01's own 52-day backtest (+35 bps/trade, t = 2.44) as the claim under test"
pass_if = "lab verdict PROMOTE_TO_PAPER"
invalidate_if = "lab verdict REJECT; then H-R01 keeps running on paper only until its own n >= 100 rule decides it"
status = "rejected"
result = "2026-11-11, lab verdict REJECT. 384 rules on Binance USDT-M 15m, 20 coins, 836 design days (2024-01-01 to 2026-04-15): every rule loses after costs (best Sharpe -0.20), reality check p = 1.00, walk-forward -10.0 bps/day [-21.4, +1.2]. H-R01's own rule (hold=24,n=288,stop=500,z=2) on those days: 15,974 trades, -19.8 bps/trade, 0 of 20 coins and 0 of 9 quarters profitable; an independent recomputation without stops gives -17 bps gross per fade on 6 coins. The same code reproduces H-R01's backtest on Hyperliquid's last 49 days (+37.4 bps/trade, 435 trades vs +35.0, 422), so the 52-day result is one favourable stretch, not an edge. Lockbox (210 days) not opened."

[[hypothesis]]
id = "H-L02"
statement = "Donchian breakouts on 1h bars (1-16 day channels) pay after costs across liquid perps"
change = "families/trend.toml, 40 specs"
metric = "lab gate, as H-L01"
baseline = "zero after costs; time-shifted copies; market beta reported"
pass_if = "lab verdict PROMOTE_TO_PAPER"
invalidate_if = "lab verdict REJECT"
status = "rejected"
result = "2026-11-11, lab verdict REJECT, the closest of the four. 40 rules on Binance 1h, 836 design days. Best: 16-day channel, long only, stop 800 bps: Sharpe 1.19 in sample, +13.9 bps/day, alpha vs the basket t = 1.9. But reality check p = 0.22, deflated Sharpe 0.23 (202 trials on this data set), PBO 0.51, walk-forward +3.9 bps/day [-13.4, +22.0], 5 of 9 quarters positive. Kept on paper as an unproven candidate (strategies/trend.json): its card says about 970 days of paper trading would be needed to confirm an edge this size. Lockbox not opened."

[[hypothesis]]
id = "H-L03"
statement = "Ranking coins against each other (losers vs winners over 1h-7d, rebalanced every 4-24h) pays after costs in one direction, reversal or momentum, market-neutral"
change = "families/xs_reversal.toml, 108 specs, both directions in the grid"
metric = "lab gate, as H-L01"
baseline = "zero after costs; time-shifted copies"
pass_if = "lab verdict PROMOTE_TO_PAPER"
invalidate_if = "lab verdict REJECT"
status = "rejected"
result = "2026-11-11, lab verdict REJECT. 108 rules (both directions) on Binance 1h. Best: 7-day momentum, daily rebalance, 5 a side: Sharpe 1.23 in sample, but walk-forward -3.0 bps/day [-9.5, +3.7], reality check p = 0.77, deflated Sharpe 0.17, one grid step away the Sharpe is -2.1, and it loses when entered one bar late. Lockbox not opened."

[[hypothesis]]
id = "H-L04"
statement = "Shorting the perps whose shorts are paid the most funding (and buying the cheapest to hold) earns the funding without losing it to price"
change = "families/funding_carry.toml, 54 specs; research uses Binance funding prints, the venue check Hyperliquid's hourly prints"
metric = "lab gate, as H-L01; funding received reported separately from price P&L"
baseline = "zero after costs; time-shifted copies"
pass_if = "lab verdict PROMOTE_TO_PAPER"
invalidate_if = "lab verdict REJECT"
status = "rejected"
result = "2026-11-11, lab verdict REJECT. 54 rules on Binance 1h with Binance funding prints. Best Sharpe 0.82 in sample (+4.6 bps/day); reality check p = 0.53, deflated Sharpe 0.14, walk-forward +0.6 bps/day [-6.9, +7.5], beats only about two thirds of its time-shifted copies. Lockbox not opened."

[[hypothesis]]
id = "H-J01"
statement = "Jev, shown an anonymised market state at a mean-reversion candidate (no coin name, date or price level), can tell fades that revert from fades that keep running"
change = "probe `fade_judge` replayed over historical candidates (`lab jev replay`); answers cached, nothing traded"
metric = "Brier skill of `p_revert` vs the base rate, AUC, and IC against the signed 6h forward return, day-clustered with a block-permutation null"
baseline = "the base rate (always answering the average); the candidate's own |z| as a one-number predictor"
pass_if = "Brier skill > 0 and IC > 0 with null percentile > 95, n >= 400 candidates across >= 30 days; then jev_gate must pass the lab gate like any family"
invalidate_if = "IC indistinguishable from the null with n >= 400; then Jev stays out of mean-reversion entries"
status = "rejected"
result = "2026-11-11, Jev jev-1.14.0, 1,233 scored candidates. Hyperliquid, 49 days, 892 entries on 20 coins: p_revert IC -0.110 (1st percentile of the day-block null: wrong-way), Brier skill -0.14, AUC 0.45; answers sit in a narrow 0.35-0.46 band. Binance, 341 entries spread over 836 days: IC -0.042 (22nd percentile), AUC 0.52: no skill, and the wrong-way reading did not repeat. p_run (goes 2% against the trade first) has AUC 0.59 and 0.64: Jev reads risk from the state, but that did not sort winners from losers. jev_gate on Hyperliquid: INSUFFICIENT_EVIDENCE (39 design days). Cost 991 tokens and about 210 ms per call; 1,485 calls in all. Jev stays out of mean-reversion entries."

[[hypothesis]]
id = "H-J02"
statement = "Jev's read of the same state predicts the direction of the next 6 hours on ordinary bars, not only at candidates"
change = "probe `direction` replayed on a sample of bars; family `jev_direction`"
metric = "IC of `p_up` against the 6h forward return, day-clustered; AUC"
baseline = "0.5 (no skill); 24h momentum sign as a one-number predictor"
pass_if = "IC > 0 with null percentile > 95, n >= 600 bars across >= 30 days; then jev_direction must pass the lab gate"
invalidate_if = "IC indistinguishable from the null with n >= 600"
status = "proposed"
result = ""

[[hypothesis]]
id = "H-J03"
statement = "Jev's skill on historical states is not memory of what happened: it is the same whether or not the coin and date are revealed"
change = "a sub-sample of H-J01's states re-asked with coin name and date shown"
metric = "IC with the date revealed minus IC anonymised, same states"
baseline = "anonymised answers"
pass_if = "difference within the null's 90% range, n >= 150: revealed replays can be trusted as much as anonymised ones"

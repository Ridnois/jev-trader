# v2 LIVE on Hyperliquid MAINNET: real money. Start only after `report` shows the
# paper engine pays after fees with enough data, and testnet plumbing has been checked.
#   jev-trader --config config.live.toml hl check
#   jev-trader --config config.live.toml run --live
data_dir = "data-v2-live"
watch = ["BTC", "ETH", "SOL", "HYPE", "XRP", "ZEC", "SUI", "DOGE", "ENA", "kPEPE"]

[exchange]
mode = "live"
network = "mainnet"
max_capital_usd = 0          # YOU choose the amount; 0 refuses to start
max_slippage_bps = 30
leverage = 1
backstop_stop = true         # reduce-only stop-market on the exchange in case the process dies
backstop_mult = 1.5

[risk]
max_positions = 2
daily_loss_pct = 0.015
